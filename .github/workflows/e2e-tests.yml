name: E2E Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  e2e:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: npx playwright install chromium

      - name: Build the production client
        run: pnpm build

      - name: Check cold feed startup on the production bundle
        env:
          IRIS_E2E_BUILT_DIST: "true"
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report-cold-start
        run: pnpm test:ci:e2e tests/graph-cold-start.spec.ts --workers=1

      - name: Run remaining E2E tests
        run: pnpm test:ci:e2e --grep-invert 'graph-cold-start\.spec\.ts'

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            playwright-report/
            playwright-report-cold-start/
          retention-days: 30
